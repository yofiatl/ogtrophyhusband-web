<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG Trophy Husband | The Total Package</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0A0A0C; color: #E2E8F0; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { border-bottom: 1px solid #22222A; background-color: #121216; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 40; }
    .gold-text { background: linear-gradient(135deg, #D4AF37 0%, #F3E5AB 50%, #AA7C11 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
    main { max-width: 1280px; margin: 0 auto; padding: 2.5rem 1rem; width: 100%; flex-grow: 1; }
    .title-sec { text-align: center; margin-bottom: 3rem; }
    .title-sec h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .title-sec p { color: #A1A1AA; font-size: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .card { background: #121216; border: 1px solid #22222A; border-radius: 0.75rem; padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.3s ease; }
    .card:hover { border-color: rgba(212,175,55,0.5); transform: translateY(-2px); }
    .img-box { width: 100%; height: 12rem; background: #0A0A0C; border-radius: 0.5rem; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #22222A; }
    .img-box img { width: 100%; height: 100%; object-fit: contain; }
    .cat { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-bottom: 0.25rem; }
    .card-title { font-weight: 700; font-size: 1.125rem; color: #FFF; margin-bottom: 0.5rem; }
    .desc { color: #A1A1AA; font-size: 0.75rem; margin-bottom: 1rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .colors-sec { margin-bottom: 1rem; }
    .colors-label { font-size: 0.75rem; color: #A1A1AA; display: block; margin-bottom: 0.25rem; }
    .colors-label span { color: #FFF; font-weight: 500; }
    .swatches { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .swatch { width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 1px solid #22222A; cursor: pointer; transition: transform 0.2s; }
    .swatch:hover { transform: scale(1.15); }
    .card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 0.75rem; border-top: 1px solid #22222A; }
    .price { font-size: 1.25rem; font-weight: 800; }
    .btn-qv { padding: 0.375rem 0.75rem; background: rgba(212,175,55,0.1); color: #D4AF37; font-size: 0.75rem; font-weight: 600; border-radius: 0.5rem; border: 1px solid rgba(212,175,55,0.3); cursor: pointer; }
    .btn-qv:hover { background: rgba(212,175,55,0.2); }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.hidden { display: none; }
    .modal-card { background: #121216; border: 1px solid #22222A; border-radius: 0.75rem; max-width: 600px; width: 100%; padding: 1.5rem; position: relative; }
    .close-btn { position: absolute; top: 0.75rem; right: 1rem; background: none; border: none; color: #A1A1AA; font-size: 1.5rem; cursor: pointer; }
    .btn-add { width: 100%; padding: 0.75rem; background: #D4AF37; color: #000; font-weight: 800; border-radius: 0.5rem; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <div class="gold-text" style="font-size:1.5rem;">OG TROPHY HUSBAND</div>
  </header>

  <main id="products">
    <div class="title-sec">
      <h1 class="gold-text">OG Trophy Husband Headwear</h1>
      <p>Premium luxury headwear engineered for unmatched style, comfort, and distinction.</p>
    </div>
    <div id="product-grid" class="grid"></div>
  </main>

  <div id="quickview-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <button id="close-modal" class="close-btn">&times;</button>
      <div id="modal-content-inner" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;"></div>
    </div>
  </div>

  <script>
    const DEFAULT_PRODUCTS = [
      { id: "dad-hat-out-of-office", name: "OG Trophy Husband \"Out of Office\" Dad Hat", price: 44.44, description: "Unstructured low-profile dad hat featuring embroidered \"Out of Office\" and classic OG Trophy Husband logo.", category: "Dad Hats", image: "/images/dad-hat-out-of-office.png", colors: [{ name: "Black", hex: "#111111" }, { name: "Navy", hex: "#1b2a4a" }, { name: "Khaki", hex: "#c2b280" }, { name: "Stone", hex: "#d3d3d3" }] },
      { id: "stealth-black-full-logo", name: "Stealth Black Full Logo Hat", price: 44.44, description: "Matte black finish with full OG Trophy Husband crest embroidered in tonal black thread.", category: "Stealth Series", image: "/images/stealth-black-full-logo.png", colors: [{ name: "Black", hex: "#0a0a0a" }, { name: "Charcoal", hex: "#2b2b2b" }, { name: "Dark Grey", hex: "#444444" }] },
      { id: "stealth-black-ogth-logo", name: "Stealth Black OGTH Logo Hat", price: 44.44, description: "Sleek all-black cap with embroidered minimalist OGTH initials on front panel.", category: "Stealth Series", image: "/images/stealth-black-ogth-logo.png", colors: [{ name: "Black", hex: "#000000" }, { name: "Charcoal", hex: "#333333" }] },
      { id: "retro-trucker-full-logo", name: "Retro Trucker Full Logo Hat", price: 44.44, description: "Classic breathable mesh snapback trucker hat with full OG Trophy Husband shield logo.", category: "Trucker Hats", image: "/images/retro-trucker-full-logo.png", colors: [{ name: "Black/White", hex: "#222222" }, { name: "Navy/White", hex: "#1e3a8a" }, { name: "Brown/Khaki", hex: "#78350f" }] },
      { id: "retro-trucker-ogth-logo", name: "Retro Trucker OGTH Logo Hat", price: 44.44, description: "Structured mesh-back trucker cap with clean OGTH front patch.", category: "Trucker Hats", image: "/images/retro-trucker-ogth-logo.png", colors: [{ name: "Black/White", hex: "#111111" }, { name: "Charcoal/Black", hex: "#374151" }] },
      { id: "signature-5-panel-full-logo", name: "Signature 5-Panel Full Logo Hat", price: 44.44, description: "Low-profile 5-panel camper style hat featuring the full OG Trophy Husband logo.", category: "5-Panel Hats", image: "/images/signature-5-panel-full-logo.png", colors: [{ name: "Black", hex: "#0f172a" }, { name: "Olive", hex: "#3f6212" }, { name: "Navy", hex: "#1e1b4b" }] },
      { id: "signature-5-panel-ogth-logo", name: "Signature 5-Panel OGTH Logo Hat", price: 44.44, description: "Modern flat-brim 5-panel cap with minimalist OGTH embroidery.", category: "5-Panel Hats", image: "/images/signature-5-panel-ogth-logo.png", colors: [{ name: "Black", hex: "#18181b" }, { name: "Olive", hex: "#4d7c0f" }, { name: "Grey", hex: "#6b7280" }] },
      { id: "clean-living-dad-hat", name: "Clean Living Dad Hat", price: 44.44, description: "100% organic cotton relaxed unstructured dad hat with Clean Living OGTH emblem.", category: "Dad Hats", image: "/images/clean-living-dad-hat.png", colors: [{ name: "Natural", hex: "#f5f5dc" }, { name: "Stone", hex: "#e5e7eb" }, { name: "Sage", hex: "#84a98c" }, { name: "Black", hex: "#000000" }] }
    ];

    function createHatSvg(colorHex, name) {
      return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="%23121216"/><path d="M 80 180 C 80 100, 320 100, 320 180 Z" fill="' + encodeURIComponent(colorHex) + '" stroke="%23D4AF37" stroke-width="3"/><path d="M 60 180 Q 200 210 340 180 Q 200 170 60 180 Z" fill="' + encodeURIComponent(colorHex) + '" stroke="%23D4AF37" stroke-width="2"/><ellipse cx="200" cy="110" rx="6" ry="4" fill="%23D4AF37"/><circle cx="200" cy="145" r="22" fill="%231A1A20" stroke="%23D4AF37" stroke-width="2"/><text x="200" y="150" font-family="sans-serif" font-size="11" font-weight="bold" fill="%23D4AF37" text-anchor="middle">OGTH</text><text x="200" y="250" font-family="sans-serif" font-size="12" fill="%23A1A1AA" text-anchor="middle">' + encodeURIComponent(name) + '</text></svg>';
    }

    let allProducts = [];

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        if(res.ok) {
          const data = await res.json();
          allProducts = data.products || DEFAULT_PRODUCTS;
        } else { allProducts = DEFAULT_PRODUCTS; }
      } catch(e) { allProducts = DEFAULT_PRODUCTS; }
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = allProducts.map(p => {
        const activeColor = p.colors && p.colors.length > 0 ? p.colors[0] : { name: 'Standard', hex: '#111' };
        const svgImg = createHatSvg(activeColor.hex, p.name);
        return '<div class="card" id="card-' + p.id + '"><div><div class="img-box"><img id="img-' + p.id + '" src="' + svgImg + '" alt="' + p.name + '" /></div><div class="cat gold-text">' + (p.category || 'Headwear') + '</div><h3 class="card-title">' + p.name + '</h3><p class="desc">' + p.description + '</p></div><div><div class="colors-sec"><span class="colors-label">Color: <span id="color-label-' + p.id + '">' + activeColor.name + '</span></span><div class="swatches">' + (p.colors || []).map(c => '<button type="button" onclick="selectColor(\'' + p.id + '\', \'' + c.name + '\', \'' + c.hex + '\')" class="swatch" style="background-color: ' + c.hex + ';" title="' + c.name + '"></button>').join('') + '</div></div><div class="card-footer"><span class="price gold-text">$' + parseFloat(p.price).toFixed(2) + '</span><button type="button" onclick="openQuickView(\'' + p.id + '\')" class="btn-qv">Quick View</button></div></div></div>';
      }).join('');
    }

    function selectColor(productId, colorName, colorHex) {
      const imgEl = document.getElementById('img-' + productId);
      const labelEl = document.getElementById('color-label-' + productId);
      const p = allProducts.find(item => item.id === productId);
      if(imgEl) imgEl.src = createHatSvg(colorHex, p ? p.name : '');
      if(labelEl) labelEl.textContent = colorName;
    }

    function openQuickView(productId) {
      const p = allProducts.find(item => item.id === productId);
      if(!p) return;
      const activeColor = p.colors && p.colors.length > 0 ? p.colors[0] : { name: 'Standard', hex: '#111' };
      const modalInner = document.getElementById('modal-content-inner');
      modalInner.innerHTML = '<div class="img-box" style="height:14rem;"><img id="modal-img" src="' + createHatSvg(activeColor.hex, p.name) + '" /></div><div style="display:flex; flex-direction:column; justify-content:space-between;"><div class="cat gold-text">' + (p.category || 'Headwear') + '</div><h2 style="font-size:1.5rem; font-weight:700; margin-bottom:0.5rem; color:#FFF;">' + p.name + '</h2><p class="price gold-text" style="font-size:1.5rem; margin-bottom:1rem;">$' + parseFloat(p.price).toFixed(2) + '</p><p style="font-size:0.875rem; color:#D1D5DB; margin-bottom:1rem;">' + p.description + '</p><div class="colors-sec"><span class="colors-label">Select Color: <span id="modal-color-label">' + activeColor.name + '</span></span><div class="swatches">' + (p.colors || []).map(c => '<button type="button" onclick="selectModalColor(\'' + p.name + '\', \'' + c.name + '\', \'' + c.hex + '\')" class="swatch" style="background-color: ' + c.hex + ';" title="' + c.name + '"></button>').join('') + '</div></div><button type="button" onclick="alert(\'Added ' + p.name + ' to bag!\')" class="btn-add">Add To Bag</button></div>';
      document.getElementById('quickview-modal').classList.remove('hidden');
    }

    function selectModalColor(productName, colorName, colorHex) {
      document.getElementById('modal-img').src = createHatSvg(colorHex, productName);
      document.getElementById('modal-color-label').textContent = colorName;
    }

    document.getElementById('close-modal').onclick = () => {
      document.getElementById('quickview-modal').classList.add('hidden');
    };

    window.onload = loadProducts;
  </script>
</body>
</html>
