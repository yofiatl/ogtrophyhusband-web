<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG Trophy Husband | The Total Package</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0A0A0C; color: #E2E8F0; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { border-bottom: 1px solid #22222A; background-color: #121216; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .gold-text { background: linear-gradient(135deg, #D4AF37 0%, #F3E5AB 50%, #AA7C11 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    main { max-width: 1280px; margin: 0 auto; padding: 2.5rem 1rem; width: 100%; flex-grow: 1; }
    .title-sec { text-align: center; margin-bottom: 3rem; }
    .title-sec h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .title-sec p { color: #A1A1AA; font-size: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .card { background: #121216; border: 1px solid #22222A; border-radius: 0.75rem; padding: 1.25rem; display: flex; flex-direction: column; transition: transform 0.2s, border-color 0.2s; }
    .card:hover { border-color: rgba(212,175,55,0.5); transform: translateY(-2px); }
    .img-box { width: 100%; height: 12rem; background: #0A0A0C; border-radius: 0.5rem; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .img-box img { width: 100%; height: 100%; object-fit: contain; }
    .cat { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-bottom: 0.25rem; color: #D4AF37; }
    .card-title { font-weight: 700; font-size: 1.125rem; color: #FFF; margin-bottom: 0.5rem; }
    .desc { color: #A1A1AA; font-size: 0.75rem; margin-bottom: 1rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .colors-sec { margin-bottom: 1rem; }
    .colors-label { font-size: 0.75rem; color: #A1A1AA; display: block; margin-bottom: 0.25rem; }
    .colors-label span { color: #FFF; font-weight: 500; }
    .swatches { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .swatch { width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 1px solid #22222A; cursor: pointer; transition: transform 0.15s, border-color 0.15s; }
    .swatch:hover { transform: scale(1.15); }
    .swatch.active { border-color: #D4AF37; transform: scale(1.15); box-shadow: 0 0 8px rgba(212,175,55,0.4); }
    .card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 0.75rem; border-top: 1px solid #22222A; margin-top: auto; }
    .price { font-size: 1.25rem; font-weight: 800; }
    .btn-qv { padding: 0.375rem 0.75rem; background: rgba(212,175,55,0.1); color: #D4AF37; font-size: 0.75rem; font-weight: 600; border: 1px solid rgba(212,175,55,0.3); border-radius: 0.375rem; cursor: pointer; transition: all 0.2s; }
    .btn-qv:hover { background: rgba(212,175,55,0.2); }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
    .modal-overlay.active { display: flex; }
    .modal { background: #121216; border: 1px solid #22222A; border-radius: 1rem; width: 100%; max-width: 32rem; padding: 2rem; position: relative; max-height: 90vh; overflow-y: auto; }
    .close-btn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: #A1A1AA; font-size: 1.5rem; cursor: pointer; }
    .close-btn:hover { color: #FFF; }
    footer { border-top: 1px solid #22222A; text-align: center; padding: 1.5rem; color: #71717A; font-size: 0.875rem; margin-top: auto; }
    .spotlight { background: linear-gradient(180deg, #16161D 0%, #121216 100%); border: 1px solid #22222A; border-radius: 1rem; padding: 2rem; margin-bottom: 3rem; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: center; }
    @media (max-width: 768px) { .spotlight { grid-template-columns: 1fr; } }
    .cart-btn { position: relative; background: none; border: 1px solid #22222A; color: #FFF; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
    .cart-btn:hover { border-color: #D4AF37; }
    .cart-badge { background: #D4AF37; color: #000; font-size: 0.75rem; font-weight: 700; border-radius: 50%; width: 1.25rem; height: 1.25rem; display: flex; align-items: center; justify-content: center; }
    .add-to-cart-btn { width: 100%; padding: 0.75rem; background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%); color: #000; font-weight: 700; border: none; border-radius: 0.5rem; cursor: pointer; margin-top: 1rem; transition: opacity 0.2s; }
    .add-to-cart-btn:hover { opacity: 0.9; }
    .cart-item { display: flex; gap: 1rem; align-items: center; padding: 1rem 0; border-bottom: 1px solid #22222A; }
    .cart-item-img { width: 4rem; height: 4rem; background: #0A0A0C; border-radius: 0.375rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
    .cart-item-img img { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <header>
    <div style="font-weight: 900; font-size: 1.25rem; tracking: 0.1em;">
      <span class="gold-text">OG TROPHY HUSBAND</span>
    </div>
    <button class="cart-btn" onclick="openCart()">
      🛒 Cart <span class="cart-badge" id="cart-count">0</span>
    </button>
  </header>

  <main>
    <div class="spotlight" id="spotlight">
      <div class="img-box" style="height: 20rem;" id="spotlight-img"></div>
      <div>
        <div class="cat">Featured Drop</div>
        <h2 id="spotlight-title" style="font-size: 2rem; margin-bottom: 0.5rem; color: #FFF;"></h2>
        <p id="spotlight-desc" style="color: #A1A1AA; margin-bottom: 1rem;"></p>
        <div class="price" id="spotlight-price" style="margin-bottom: 1rem; color: #D4AF37;"></div>
        <button class="add-to-cart-btn" id="spotlight-add-btn">Add to Cart</button>
      </div>
    </div>

    <div class="title-sec">
      <h1>The Hat Collection</h1>
      <p>Premium headwear for the ultimate trophy husband lifestyle.</p>
    </div>

    <div class="grid" id="product-grid"></div>
  </main>

  <!-- Quick View Modal -->
  <div class="modal-overlay" id="qv-modal">
    <div class="modal">
      <button class="close-btn" onclick="closeQuickView()">&times;</button>
      <div class="img-box" style="height: 16rem;" id="qv-img-container"></div>
      <div class="cat" id="qv-cat"></div>
      <h2 id="qv-title" style="font-size: 1.5rem; color: #FFF; margin-bottom: 0.5rem;"></h2>
      <p id="qv-desc" style="color: #A1A1AA; margin-bottom: 1rem; font-size: 0.875rem;"></p>
      <div class="colors-sec">
        <label class="colors-label">Color: <span id="qv-color-name"></span></label>
        <div class="swatches" id="qv-swatches"></div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;">
        <div class="price" id="qv-price" style="color: #D4AF37;"></div>
        <button class="add-to-cart-btn" id="qv-add-btn" style="width: auto; padding: 0.75rem 2rem; margin-top: 0;">Add to Cart</button>
      </div>
    </div>
  </div>

  <!-- Cart Modal -->
  <div class="modal-overlay" id="cart-modal">
    <div class="modal">
      <button class="close-btn" onclick="closeCart()">&times;</button>
      <h2 style="font-size: 1.5rem; color: #FFF; margin-bottom: 1.5rem;">Your Cart</h2>
      <div id="cart-items"></div>
      <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #22222A; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: 700; font-size: 1.125rem;">Total:</span>
        <span class="price" id="cart-total" style="color: #D4AF37;">$0.00</span>
      </div>
      <button class="add-to-cart-btn" style="margin-top: 1.5rem;" onclick="alert('Checkout integration coming soon!')">Proceed to Checkout</button>
    </div>
  </div>

  <footer>
    &copy; 2026 OG Trophy Husband. All rights reserved.
  </footer>

  <script src="/config/products.js"></script>
  <script>
    let cart = [];const COfunction getVariantFilterStyle(item, colorName) { if (!colorName) return 'none'; if (typeof colorName === 'object') colorName = colorName.name || colorName.color || ''; if (item && item.variantDetails && item.variantDetails[colorName] && (item.variantDetails[colorName].image || item.variantDetails[colorName].img || item.variantDetails[colorName].imageUrl)) { return 'none'; } return COLOR_PHOTO_FILTERS[colorName] || 'none'; } function selectCardVariant(productId, colorName) { const card = document.getElementById('card-' + productId); const p = typeof PRODUCTS !== 'undefined' ? PRODUCTS.find(x => x.id === productId) : null; const cardImg = card ? card.querySelector('img') : null; if (cardImg) { cardImg.style.filter = getVariantFilterStyle(p, colorName); } } function renderModalVariantPills() { if (!currentQvProduct) return; const modalImg = document.querySelector('#qv-img-container img') || document.getElementById('modalProductImg'); const selectedModalProduct = currentQvProduct; const selectedModalColor = selectedColor ? (typeof selectedColor === 'string' ? selectedColor : selectedColor.name) : ''; if (modalImg) { modalImg.style.filter = getVariantFilterStyle(selectedModalProduct, selectedModalColor); } } function renderProductGrid() { if (typeof renderProducts === 'function') renderProducts(); } function renderconst COLOR_PHOTO_FILTERS = {'Black':'none','Stealth Black':'brightness(0.88) contrast(1.12)','Black / White':'brightness(1.06) contrast(1.08)','Navy':'sepia(0.85) hue-rotate(188deg) saturate(2.6) brightness(0.92) contrast(1.06)','Navy / White':'sepia(0.75) hue-rotate(188deg) saturate(2.3) brightness(0.98) contrast(1.06)','Cranberry':'sepia(0.9) hue-rotate(312deg) saturate(3.1) brightness(0.88) contrast(1.08)','Red':'sepia(0.95) hue-rotate(324deg) saturate(3.8) brightness(0.94) contrast(1.1)','Spruce':'sepia(0.85) hue-rotate(96deg) saturate(2.4) brightness(0.88) contrast(1.06)','Evergreen':'sepia(0.88) hue-rotate(102deg) saturate(2.5) brightness(0.84) contrast(1.08)','Dark Grey':'brightness(1.28) saturate(0.2) contrast(0.92)','Charcoal':'brightness(1.22) saturate(0.25) contrast(0.95)','Charcoal / White':'brightness(1.32) saturate(0.25) contrast(0.95)','Green Camo':'sepia(0.82) hue-rotate(62deg) saturate(2.1) brightness(0.92) contrast(1.08)','Brown / Khaki':'sepia(0.92) hue-rotate(348deg) saturate(2.2) brightness(0.98) contrast(1.04)','Rustic Orange / Khaki':'sepia(0.95) hue-rotate(338deg) saturate(3.1) brightness(1.04) contrast(1.06)','Moss / Khaki':'sepia(0.85) hue-rotate(52deg) saturate(2.0) brightness(0.98) contrast(1.04)','Khaki':'sepia(0.75) hue-rotate(8deg) saturate(1.6) brightness(1.38) contrast(0.88)','Light Blue':'sepia(0.85) hue-rotate(174deg) saturate(2.5) brightness(1.28) contrast(0.92)','White':'brightness(1.68) contrast(0.82) saturate(0.15)'};CartDrawer() { if (typeof renderCart === 'function') renderCart(); }LOR_PHOTO_FILTERS = { 'Black': 'none', 'Stealth Black': 'brightness(0.88) contrast(1.12)' };
    
    let currentQvProduct = null;
    let selectedColor = null;

    function init() {
      if (typeof PRODUCTS === 'undefined' || !PRODUCTS.length) return;
      renderSpotlight();
      renderProducts();
    }

    function renderSpotlight() {
      const p = PRODUCTS[0];
      if (!p) return;
      document.getElementById('spotlight-img').innerHTML = `<img src="${p.image}" alt="${p.name}">`;
      document.getElementById('spotlight-title').innerText = p.name;
      document.getElementById('spotlight-desc').innerText = p.description;
      document.getElementById('spotlight-price').innerText = `$${p.price.toFixed(2)}`;
      document.getElementById('spotlight-add-btn').onclick = () => addToCart(p, p.colors ? p.colors[0] : null);
    }

    function renderProducts() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = PRODUCTS.map(p => {
        const imgHtml = `<img src="${p.image}" alt="${p.name}">`;
        const swatches = p.colors ? p.colors.map((c, i) => 
          `<div class="swatch ${i===0?'active':''}" style="background-color: ${c.hex};" title="${c.name}" onclick="selectCardColor('${p.id}', ${i}, '${c.image}')"></div>`
        ).join('') : '';

        return `
          <div class="card" id="card-${p.id}">
            <div class="img-box" id="card-img-${p.id}">
              ${imgHtml}
            </div>
            <div class="cat">${p.category}</div>
            <div class="card-title">${p.name}</div>
            <div class="desc">${p.description}</div>
            ${p.colors ? `
              <div class="colors-sec">
                <div class="swatches">${swatches}</div>
              </div>
            ` : ''}
            <div class="card-footer">
              <div class="price">$${p.price.toFixed(2)}</div>
              <button class="btn-qv" onclick="openQuickView('${p.id}')">Quick View</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectCardColor(productId, colorIndex, colorImg) {
      const card = document.getElementById(`card-${productId}`);
      if (!card) return;
      const swatches = card.querySelectorAll('.swatch');
      swatches.forEach((s, i) => s.classList.toggle('active', i === colorIndex));
      if (colorImg) {
        document.getElementById(`card-img-${productId}`).innerHTML = `<img src="${colorImg}" alt="Hat">`;
      }
    }

    function openQuickView(id) {
      const p = PRODUCTS.find(x => x.id === id);
      if (!p) return;
      currentQvProduct = p;
      selectedColor = p.colors ? p.colors[0] : null;

      document.getElementById('qv-cat').innerText = p.category;
      document.getElementById('qv-title').innerText = p.name;
      document.getElementById('qv-desc').innerText = p.description;
      document.getElementById('qv-price').innerText = `$${p.price.toFixed(2)}`;

      const colorImg = selectedColor ? selectedColor.image : p.image;
      document.getElementById('qv-img-container').innerHTML = `<img src="${colorImg}" alt="${p.name}">`;

      if (p.colors && p.colors.length) {
        document.getElementById('qv-color-name').innerText = selectedColor.name;
        document.getElementById('qv-swatches').innerHTML = p.colors.map((c, i) => `
          <div class="swatch ${i===0?'active':''}" style="background-color: ${c.hex};" title="${c.name}" onclick="selectQvColor(${i})"></div>
        `).join('');
      } else {
        document.getElementById('qv-color-name').innerText = 'Standard';
        document.getElementById('qv-swatches').innerHTML = '';
      }

      document.getElementById('qv-add-btn').onclick = () => {
        addToCart(currentQvProduct, selectedColor);
        closeQuickView();
      };

      document.getElementById('qv-modal').classList.add('active');
    }

    function selectQvColor(index) {
      if (!currentQvProduct || !currentQvProduct.colors) return;
      selectedColor = currentQvProduct.colors[index];
      document.getElementById('qv-color-name').innerText = selectedColor.name;

      const swatches = document.querySelectorAll('#qv-swatches .swatch');
      swatches.forEach((s, i) => s.classList.toggle('active', i === index));

      const img = selectedColor.image || currentQvProduct.image;
      document.getElementById('qv-img-container').innerHTML = `<img src="${img}" alt="${currentQvProduct.name}">`;
    }

    function closeQuickView() {
      document.getElementById('qv-modal').classList.remove('active');
    }

    function addToCart(product, color) {
      const existing = cart.find(item => item.product.id === product.id && item.color?.name === color?.name);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          product,
          color,
          quantity: 1,
          image: color?.image || product.image
        });
      }
      updateCartCount();
    }

    function updateCartCount() {
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cart-count').innerText = count;
    }

    function openCart() {
      renderCart();
      document.getElementById('cart-modal').classList.add('active');
    }

    function closeCart() {
      document.getElementById('cart-modal').classList.remove('active');
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      if (!cart.length) {
        container.innerHTML = '<p style="color: #A1A1AA; text-align: center; padding: 2rem 0;">Your cart is empty.</p>';
        document.getElementById('cart-total').innerText = '$0.00';
        return;
      }

      let total = 0;
      container.innerHTML = cart.map((item, index) => {
        const itemTotal = item.product.price * item.quantity;
        total += itemTotal;
        const imgHtml = `<img src="${item.image}" alt="${item.product.name}">`;

        return `
          <div class="cart-item">
            <div class="cart-item-img">${imgHtml}</div>
            <div style="flex-grow: 1;">
              <div style="font-weight: 600; color: #FFF; font-size: 0.875rem;">${item.product.name}</div>
              ${item.color ? `<div style="font-size: 0.75rem; color: #A1A1AA;">Color: ${item.color.name}</div>` : ''}
              <div style="font-size: 0.875rem; color: #D4AF37; margin-top: 0.25rem;">$${item.product.price.toFixed(2)} x ${item.quantity}</div>
            </div>
            <button onclick="removeFromCart(${index})" style="background: none; border: none; color: #EF4444; cursor: pointer; font-size: 1.25rem;">&times;</button>
          </div>
        `;
      }).join('');

      document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartCount();
      renderCart();
    }

    window.onload = init;
  </script>
</body>
</html>
