<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG Trophy Husband | The Total Package</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0A0A0C; color: #E2E8F0; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { border-bottom: 1px solid #22222A; background-color: #121216; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .gold-text { background: linear-gradient(135deg, #D4AF37 0%, #F3E5AB 50%, #AA7C11 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
    main { max-width: 1280px; margin: 0 auto; padding: 2.5rem 1rem; width: 100%; flex-grow: 1; }
    .title-sec { text-align: center; margin-bottom: 3rem; }
    .title-sec h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .title-sec p { color: #A1A1AA; font-size: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .card { background: #121216; border: 1px solid #22222A; border-radius: 0.75rem; padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.2s ease; }
    .card:hover { border-color: rgba(212,175,55,0.5); transform: translateY(-2px); }
    .img-box { width: 100%; height: 12rem; background: #0A0A0C; border-radius: 0.5rem; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .img-box img { width: 100%; height: 100%; object-fit: contain; }
    .cat { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-bottom: 0.25rem; }
    .card-title { font-weight: 700; font-size: 1.125rem; color: #FFF; margin-bottom: 0.5rem; }
    .desc { color: #A1A1AA; font-size: 0.75rem; margin-bottom: 1rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .colors-sec { margin-bottom: 1rem; }
    .colors-label { font-size: 0.75rem; color: #A1A1AA; display: block; margin-bottom: 0.25rem; }
    .colors-label span { color: #FFF; font-weight: 500; }
    .swatches { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .swatch { width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 1px solid #22222A; cursor: pointer; transition: transform 0.15s ease; }
    .swatch:hover { transform: scale(1.15); }
    .card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 0.75rem; border-top: 1px solid #22222A; }
    .price { font-size: 1.25rem; font-weight: 800; }
    .btn-qv { padding: 0.375rem 0.75rem; background: rgba(212,175,55,0.1); color: #D4AF37; font-size: 0.75rem; font-weight: 600; border-radius: 0.375rem; cursor: pointer; border: none; }
    .btn-qv:hover { background: rgba(212,175,55,0.2); }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: #121216; border: 1px solid #22222A; border-radius: 1rem; width: 100%; max-width: 32rem; padding: 2rem; position: relative; }
    .close-btn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: #A1A1AA; font-size: 1.5rem; cursor: pointer; }
    footer { border-top: 1px solid #22222A; text-align: center; padding: 1.5rem; color: #71717A; font-size: 0.875rem; margin-top: auto; }
  </style>
</head>
<body>
  <header>
    <div style="font-weight: 900; font-size: 1.25rem; tracking: 0.1em;">
      <span class="gold-text">OG TROPHY HUSBAND</span>
    </div>
  </header>
  <main>
    <div class="title-sec">
      <h1>The <span class="gold-text">Hat Collection</span></h1>
      <p>Premium headwear for the certified trophy husband.</p>
    </div>
    <div id="product-grid" class="grid"></div>
  </main>
  <footer>
    <p>&copy; 2026 OG Trophy Husband. All rights reserved.</p>
  </footer>
  <div id="modal-overlay" class="modal-overlay" onclick="closeQuickView(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeQuickView()">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>
  <script>
    const DEFAULT_PRODUCTS = [
      { id: 'dad-hat-out-of-office', name: 'OG Trophy Husband "Out of Office" Dad Hat', category: 'Dad Hats', price: 34.00, description: 'Relaxed fit unstructured cap featuring clean embroidery. Built for lazy Sundays and golf outings.', colors: [{ name: 'Stealth Black', hex: '#121216' }, { name: 'Navy', hex: '#1B2A4A' }, { name: 'Washed Olive', hex: '#3B4A39' }] },
      { id: 'signature-5-panel', name: 'Signature 5-Panel Full Logo Hat', category: '5-Panel', price: 38.00, description: 'Modern 5-panel structured hat with gold emblem detailing. Statement piece for the main character.', colors: [{ name: 'Gold Standard', hex: '#D4AF37' }, { name: 'Matte Black', hex: '#1E1E24' }] },
      { id: 'classic-trucker', name: 'Classic Trophy Trucker Hat', category: 'Truckers', price: 32.00, description: 'High-profile foam trucker with breathable mesh backing. Keeps you cool while looking golden.', colors: [{ name: 'Black / White', hex: '#2A2A2A' }, { name: 'Royal / White', hex: '#1E3A8A' }] }
    ];

    function createHatSvg(colorHex, name) {
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="#121216"/><path d="M 80 180 C 80 100, 320 100, 320 180 Z" fill="' + colorHex + '" stroke="#D4AF37" stroke-width="3"/><path d="M 60 180 Q 200 210 340 180 Q 200 170 60 180 Z" fill="' + colorHex + '" stroke="#D4AF37" stroke-width="2"/><ellipse cx="200" cy="110" rx="6" ry="4" fill="#D4AF37"/><circle cx="200" cy="145" r="22" fill="#1A1A20" stroke="#D4AF37" stroke-width="2"/><text x="200" y="150" font-family="sans-serif" font-size="11" font-weight="bold" fill="#D4AF37" text-anchor="middle">OGTH</text><text x="200" y="250" font-family="sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">' + name + '</text></svg>';
      return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
    }

    let products = DEFAULT_PRODUCTS;
    let selectedColors = {};

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        if(res.ok) {
          const data = await res.json();
          if(data.products && data.products.length) products = data.products;
        }
      } catch(e) { console.error('Failed to load products', e); }
      products.forEach(p => { if(p.colors && p.colors.length) selectedColors[p.id] = p.colors[0]; });
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = products.map(p => {
        const activeColor = selectedColors[p.id] || (p.colors ? p.colors[0] : { name: 'Default', hex: '#121216' });
        const svgImg = createHatSvg(activeColor.hex, p.name);
        const colorSwatches = (p.colors || []).map(c => 
          '<div class="swatch" style="background-color:' + c.hex + '; ' + (c.name === activeColor.name ? 'outline:2px solid #D4AF37; outline-offset:2px;' : '') + '" onclick="selectColor(\'' + p.id + '\', \'' + c.name + '\', \'' + c.hex + '\')" title="' + c.name + '"></div>'
        ).join('');
        return '<div class="card" id="card-' + p.id + '"><div><div class="img-box"><img id="img-' + p.id + '" src="' + svgImg + '" alt="' + p.name + '" /></div><div class="cat gold-text">' + p.category + '</div><div class="card-title">' + p.name + '</div><div class="desc">' + p.description + '</div><div class="colors-sec"><span class="colors-label">Color: <span id="color-label-' + p.id + '">' + activeColor.name + '</span></span><div class="swatches">' + colorSwatches + '</div></div></div><div class="card-footer"><span class="price">$' + p.price.toFixed(2) + '</span><button class="btn-qv" onclick="openQuickView(\'' + p.id + '\')">Quick View</button></div></div>';
      }).join('');
    }

    function selectColor(productId, colorName, colorHex) {
      selectedColors[productId] = { name: colorName, hex: colorHex };
      const label = document.getElementById('color-label-' + productId);
      if(label) label.innerText = colorName;
      const imgEl = document.getElementById('img-' + productId);
      const p = products.find(prod => prod.id === productId);
      if(imgEl) imgEl.src = createHatSvg(colorHex, p ? p.name : '');
      const card = document.getElementById('card-' + productId);
      if(card) {
        const swatches = card.querySelectorAll('.swatch');
        swatches.forEach(s => {
          if(s.title === colorName) s.style.outline = '2px solid #D4AF37';
          else s.style.outline = 'none';
        });
      }
    }

    function openQuickView(productId) {
      const p = products.find(prod => prod.id === productId);
      if(!p) return;
      const activeColor = selectedColors[productId] || (p.colors ? p.colors[0] : { name: 'Default', hex: '#121216' });
      const modalContent = document.getElementById('modal-content');
      modalContent.innerHTML = '<div class="img-box" style="height:14rem;"><img id="modal-img" src="' + createHatSvg(activeColor.hex, p.name) + '" alt="' + p.name + '" /></div><div class="cat gold-text" style="margin-top:1rem;">' + p.category + '</div><h2 style="font-size:1.5rem; color:#FFF; margin-bottom:0.5rem;">' + p.name + '</h2><p style="color:#A1A1AA; font-size:0.875rem; margin-bottom:1rem;">' + p.description + '</p><div class="colors-sec"><span class="colors-label">Selected Color: <span id="modal-color-label">' + activeColor.name + '</span></span><div class="swatches">' + (p.colors || []).map(c => '<div class="swatch" style="background-color:' + c.hex + '; ' + (c.name === activeColor.name ? 'outline:2px solid #D4AF37; outline-offset:2px;' : '') + '" onclick="selectModalColor(\'' + p.name + '\', \'' + c.name + '\', \'' + c.hex + '\')" title="' + c.name + '"></div>').join('') + '</div></div><div style="display:flex; justify-between; align-items:center; margin-top:1.5rem; padding-top:1rem; border-top:1px solid #22222A;"><span style="font-size:1.5rem; font-weight:800;">$' + p.price.toFixed(2) + '</span><button style="padding:0.5rem 1.5rem; background:#D4AF37; color:#0A0A0C; font-weight:700; border-radius:0.375rem; border:none; cursor:pointer;">Add to Cart</button></div>';
      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function selectModalColor(productName, colorName, colorHex) {
      document.getElementById('modal-color-label').innerText = colorName;
      document.getElementById('modal-img').src = createHatSvg(colorHex, productName);
    }

    function closeQuickView(e) {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    loadProducts();
  </script>
</body>
</html>
